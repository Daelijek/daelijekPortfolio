name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Blocking: lint, types, unit tests, production build, end-to-end tests.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # CASE_FIXTURES adds edge-case case studies for the template tests (never in production builds).
      - run: npm run build
        env:
          CASE_FIXTURES: '1'
      # Chromium plus the Safari (WebKit) and Firefox engines for the cross-browser projects.
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # Report-only: Lighthouse scores drift on shared CI machines, and audit findings in
  # dev tooling should not block a merge. Results are visible in the job summary.
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.15.1 autorun
